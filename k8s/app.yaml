# Week 8 lab, Step 6. YOUR M3 image on YOUR cluster - the first step of M4.
# Fill the four ____ blanks, then:
#   kubectl apply -f playground/mine.yaml
#   kubectl rollout status deployment/mine --timeout=120s
#   kubectl port-forward service/mine 8080:80      and in another terminal:
#   curl -i localhost:8080/healthz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mine
  template:
    metadata:
      labels:
        app: mine
    spec:
      containers:
        - name: app
          image: ghcr.io/dossob/inf345-week3:afaa7f911bb2002d169f828bf4c48e79a972ddca
          env:
            - name: PORT
              value: "9123"
          ports:
            - containerPort: 9123
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9123
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: mine
spec:
  selector:
    app: mine
  ports:
    - port: 80
      targetPort: 9123