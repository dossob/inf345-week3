name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the Dockerfile
        run: docker build --check .

      - name: Build the image
        run: docker build -t app:ci .

      - name: Show layers, size and CPU type
        run: |
          docker history app:ci
          docker image ls app:ci
          docker image inspect --format 'built for: {{.Os}}/{{.Architecture}}' app:ci
          test "$(docker image inspect --format '{{.Config.User}}' app:ci)" = '1000:1000'
          test "$(docker image inspect --format '{{.Size}}' app:ci)" -lt 500000000

      - name: Run the application tests inside the image
        run: docker run --rm app:ci bash scripts/test.sh

      - name: Run on a custom port and call the API
        run: |
          docker run -d --name app -e PORT=9123 -p 127.0.0.1:9123:9123 app:ci
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:9123/healthz
          echo
          curl --fail --silent --show-error http://localhost:9123/
          echo
          curl --fail --silent --show-error http://localhost:9123/notes
          echo
          docker exec app id

      - name: Show container output on failure
        if: failure()
        run: docker logs app || true

      - name: Stop the test container
        if: always()
        run: docker rm -f app || true
